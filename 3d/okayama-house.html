:root{
  --ink:#16181c; --ink2:#1e2126; --ink3:#282c33;
  --paper:#f2f0eb; --paper2:#ffffff; --paper3:#e7e4dd;
  --fg:#1b1d21; --muted:#6d6a63; --line:#d3cfc6;
  --accent:#7a5a3a; --accent-soft:#7a5a3a22;
  --sky:#cfd5dc;
  --panel:var(--paper2); --panel2:var(--paper3); --ground:var(--paper);
  --shadow:0 1px 2px rgba(30,26,20,.07), 0 8px 24px -12px rgba(30,26,20,.18);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--fg);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:14px; line-height:1.6}
.app{display:grid; grid-template-columns:316px 1fr; height:100vh; min-height:560px}
@media (max-width:900px){
  .app{grid-template-columns:1fr; grid-template-rows:auto auto; height:auto}
  .stage{order:-1; height:72vh; min-height:380px}
  .rail{border-right:0; border-top:1px solid var(--line)}
}
.rail{background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; display:flex; flex-direction:column}
.brand{padding:18px 20px 14px; border-bottom:1px solid var(--line)}
.eyebrow{font-family:"Roboto Mono",ui-monospace,monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
.brand h1{margin:0; font-size:17px; font-weight:700; text-wrap:balance}
.brand p{margin:5px 0 0; font-size:12px; color:var(--muted)}
.sec{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.sec > h2{margin:0; font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--muted); display:flex; justify-content:space-between; align-items:baseline}
.sec > h2 span{font-family:"Roboto Mono",monospace; font-weight:400; letter-spacing:0; font-size:10.5px}
.cams{display:flex; flex-direction:column; gap:4px}
.cam{display:grid; grid-template-columns:34px 1fr; align-items:center; gap:10px; padding:7px 9px; border:1px solid transparent; border-radius:3px; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer}
.cam:hover{background:var(--panel2)}
.cam[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
.cam b{font-family:"Roboto Mono",monospace; font-size:15px; font-weight:500; color:var(--accent)}
.cam i{font-style:normal; font-size:12.5px}
.legend{display:flex; flex-direction:column; gap:1px}
.lay{display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:10px; padding:5px 4px; cursor:pointer; border-radius:3px; font-size:12.5px}
.lay:hover{background:var(--panel2)}
.lay .sw{width:14px; height:14px; border-radius:2px; border:1px solid rgba(0,0,0,.18)}
.lay input{appearance:none; margin:0; width:26px; height:15px; border-radius:9px; background:var(--line); position:relative; cursor:pointer; transition:background .15s}
.lay input::after{content:""; position:absolute; top:2px; left:2px; width:11px; height:11px; border-radius:50%; background:var(--panel); transition:transform .15s}
.lay input:checked{background:var(--accent)}
.lay input:checked::after{transform:translateX(11px)}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12.5px}
.row output{font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums; color:var(--accent)}
input[type=range]{width:100%; accent-color:var(--accent)}
.chips{display:flex; gap:5px; flex-wrap:wrap}
.chip{font:inherit; font-size:11.5px; padding:4px 9px; border-radius:99px; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.hint{font-size:11.5px; color:var(--muted); line-height:1.6; margin:0}
.hint b{color:var(--fg); font-weight:500}
ul.hint{padding-left:1.1em}
ul.hint li{margin:2px 0}
.stage{position:relative; background:var(--ground); overflow:hidden}
canvas{display:block; width:100%; height:100%; touch-action:none}
.ctxtog{position:absolute; left:16px; top:16px; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.94); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:6px; padding:5px 6px 5px 11px; font-size:12.5px; z-index:2}
.ctxtog span{font-weight:500}
.seg{display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden}
.seg button{font:inherit; font-size:12.5px; padding:6px 12px; border:0; background:var(--panel); color:var(--muted); cursor:pointer; min-width:52px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
.seg button:disabled{cursor:default; opacity:.5}
.ctxtog small{color:var(--muted); font-size:11px; padding-right:4px}
body.render .ctxtog{display:none!important}
.compass{position:absolute; top:16px; right:16px; width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.86); border:1px solid var(--line); box-shadow:var(--shadow); display:grid; place-items:center}
.titleblock{position:absolute; right:16px; bottom:16px; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); font-size:11.5px; display:grid; grid-template-columns:auto auto auto; max-width:min(94%,470px); margin:0}
.titleblock div{padding:6px 11px; border-top:1px solid var(--line)}
.titleblock div:nth-child(-n+3){border-top:0}
.titleblock dt{margin:0; color:var(--muted); font-size:10.5px; letter-spacing:.06em}
.titleblock dd{margin:1px 0 0; font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums}
.titleblock .wide{grid-column:1/-1}
.titleblock .wide dd{font-family:inherit; font-weight:500}
.tip{position:absolute; pointer-events:none; background:rgba(22,24,28,.88); color:#fff; font-size:12px; padding:5px 9px; border-radius:3px; white-space:nowrap; transform:translate(12px,12px); display:none}
.badge{position:absolute; left:16px; top:66px; background:rgba(255,255,255,.9); border:1px solid var(--line); box-shadow:var(--shadow); font-size:11.5px; padding:6px 10px; border-radius:3px; max-width:min(60%,520px)}
.tbsec{display:none}
@media (max-width:900px){
  .stage .titleblock{display:none}
  .badge{display:none}
  .tbsec{display:flex}
  .tb2{position:static; max-width:none; box-shadow:none}
  .compass{width:46px; height:46px; top:12px; right:12px}
  .ctxtog{top:12px; left:12px}
  .ctxtog small{display:none}
}

/* ===== 2. ジオメトリ（mm：X＝図面の右, Y＝図面の上, Z＝上） ===== */
const S=0.001, bucket={};
function B(l,m){const k=l+'|'+m; return bucket[k]||(bucket[k]={pos:[],layer:l,mat:m});}
function tri(b,a,c,d){b.pos.push(a[0],a[1],a[2],c[0],c[1],c[2],d[0],d[1],d[2]);}
function quad(b,a,c,d,e){tri(b,a,c,d);tri(b,a,d,e);}
const V=(x,y,z)=>[x*S,z*S,-y*S];
function box(layer,mat,x0,y0,z0,x1,y1,z1){
  if(Math.abs(x1-x0)<0.4||Math.abs(y1-y0)<0.4||Math.abs(z1-z0)<0.4) return;
  const b=B(layer,mat);
  const ax=Math.min(x0,x1)*S,bx=Math.max(x0,x1)*S, ay=Math.min(z0,z1)*S,by=Math.max(z0,z1)*S;
  const az=-Math.max(y0,y1)*S,bz=-Math.min(y0,y1)*S;
  quad(b,[ax,ay,bz],[bx,ay,bz],[bx,by,bz],[ax,by,bz]); quad(b,[bx,ay,az],[ax,ay,az],[ax,by,az],[bx,by,az]);
  quad(b,[bx,ay,bz],[bx,ay,az],[bx,by,az],[bx,by,bz]); quad(b,[ax,ay,az],[ax,ay,bz],[ax,by,bz],[ax,by,az]);
  quad(b,[ax,by,bz],[bx,by,bz],[bx,by,az],[ax,by,az]); quad(b,[ax,ay,az],[bx,ay,az],[bx,ay,bz],[ax,ay,bz]);
}
/* 多角形の柱（敷地・周辺建物・ゆがんだ平面）pts=[[x,y],...] mm */
function prism(layer,mat,pts,z0,z1,noBottom){
  const b=B(layer,mat); const n=pts.length;
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];
    quad(b,V(p[0],p[1],z0),V(q[0],q[1],z0),V(q[0],q[1],z1),V(p[0],p[1],z1));}
  const v2=pts.map(p=>new THREE.Vector2(p[0],p[1]));
  const tris=THREE.ShapeUtils.triangulateShape(v2,[]);
  tris.forEach(t=>{const [a,c,d]=t.map(k=>pts[k]);
    tri(b,V(a[0],a[1],z1),V(c[0],c[1],z1),V(d[0],d[1],z1));
    if(!noBottom) tri(b,V(a[0],a[1],z0),V(d[0],d[1],z0),V(c[0],c[1],z0));});
}
function flat(layer,mat,pts,z){ const b=B(layer,mat);
  const tris=THREE.ShapeUtils.triangulateShape(pts.map(p=>new THREE.Vector2(p[0],p[1])),[]);
  tris.forEach(t=>{const [a,c,d]=t.map(k=>pts[k]); tri(b,V(a[0],a[1],z),V(c[0],c[1],z),V(d[0],d[1],z));}); }

  const m=new THREE.MeshLambertMaterial({color:d.c,side:THREE.DoubleSide});
  if(d.e!==undefined){m.emissive=new THREE.Color(d.e);}
  if(d.o!==undefined){m.transparent=true;m.opacity=d.o;m.depthWrite=d.o>0.7;}
  return materials[k]=m; }
Object.values(bucket).forEach(b=>{
  if(!b.pos.length) return;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(b.pos,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,getMat(b.mat));
  const d=MAT[b.mat]||{}; m.castShadow=!(d.o<0.7); m.receiveShadow=true;
  (groups[b.layer]||groups[LAYERS[0].id]).add(m);
});
TEX.forEach(([layer,cv,a,c,z0,z1])=>{
  const tx=new THREE.CanvasTexture(cv); tx.encoding=THREE.sRGBEncoding; tx.anisotropy=8;
  const L=Math.hypot(c[0]-a[0],c[1]-a[1])*S, H=(z1-z0)*S;
  const g=new THREE.PlaneGeometry(L,H);
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:tx,side:THREE.DoubleSide}));
  const ang=Math.atan2(c[1]-a[1],c[0]-a[0]);
  m.position.set((a[0]+c[0])/2*S,(z0+z1)/2*S,-(a[1]+c[1])/2*S);
  m.rotation.y=ang; m.receiveShadow=true; m.castShadow=false;
  groups[layer].add(m);
});
(function(){
  const sph=new THREE.SphereGeometry(0.5,9,7), cyl=new THREE.CylinderGeometry(0.05,0.065,1,7);
  const leaf=new THREE.MeshLambertMaterial({color:0x6b8f52}), trunk=new THREE.MeshLambertMaterial({color:0x6e5c4a});
  TREES.forEach(([x,y,h,w])=>{ const px=x*S,pz=-y*S,r=w*S/2,hh=h*S;
    const put=(gm,mat,sx,sy,sz,ox,oy,oz)=>{const m=new THREE.Mesh(gm,mat); m.scale.set(sx,sy,sz); m.position.set(px+ox,oy,pz+oz); m.castShadow=true; groups.plant&&groups.plant.add(m);};
    put(cyl,trunk,1.2,hh*0.55,1.2,0,hh*0.275,0);
    put(sph,leaf,r*2,hh*0.62,r*2,0,hh*0.68,0); put(sph,leaf,r*1.3,hh*0.4,r*1.3,r*0.35,hh*0.82,r*0.2);
  });
})();

/* ===== 4. 周辺建物（PLATEAU 等）と道路の縁 ===== */
const ctxMat=new THREE.MeshLambertMaterial({color:0xf3f5f8,emissive:0x7a8088,transparent:true,opacity:0.55,side:THREE.DoubleSide,depthWrite:false});
const ctxUnk=new THREE.MeshLambertMaterial({color:0xd9c9b6,emissive:0x6a5e50,transparent:true,opacity:0.45,side:THREE.DoubleSide,depthWrite:false});
const ctxPick=[];
(function(){
  const sets=[[CONTEXT.bld.filter(b=>!b.u),ctxMat],[CONTEXT.bld.filter(b=>b.u),ctxUnk]];
  const edge=[];
  sets.forEach(([list,mat])=>{
    const pos=[], idx=[];
    list.forEach(bd=>{ const start=pos.length/9; const p=bd.p, h=bd.h, n=p.length;
      for(let i=0;i<n;i++){const a=p[i],c=p[(i+1)%n];
        const A=V(a[0],a[1],0),C=V(c[0],c[1],0),D=V(c[0],c[1],h),E=V(a[0],a[1],h);
        pos.push(...A,...C,...D,...A,...D,...E);
        edge.push(...E,...D,...A,...E);}
      let tris=[]; try{tris=THREE.ShapeUtils.triangulateShape(p.map(q=>new THREE.Vector2(q[0],q[1])),[]);}catch(e){}
      tris.forEach(t=>{t.forEach(k=>pos.push(...V(p[k][0],p[k][1],h)));});
      idx.push([start,pos.length/9,bd]); });
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.computeVertexNormals();
    const m=new THREE.Mesh(g,mat); m.receiveShadow=true; m.castShadow=true; m.renderOrder=2; groups.ctx.add(m); ctxPick.push([m,idx]);
  });
  const eg=new THREE.BufferGeometry(); eg.setAttribute('position',new THREE.Float32BufferAttribute(edge,3));
  const el=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x8d949c,transparent:true,opacity:0.55}));
  el.renderOrder=3; groups.ctx.add(el); window.__ctxEdge=el;
  const rl=[]; (CONTEXT.lines||[]).forEach(l=>{ for(let i=0;i<l.p.length-1;i++){ rl.push(...V(l.p[i][0],l.p[i][1],25),...V(l.p[i+1][0],l.p[i+1][1],25)); } });
  const rg=new THREE.BufferGeometry(); rg.setAttribute('position',new THREE.Float32BufferAttribute(rl,3));
  groups.road.add(new THREE.LineSegments(rg,new THREE.LineBasicMaterial({color:0x7d838a})));
  const gr=new THREE.Mesh(new THREE.CircleGeometry(700,64),new THREE.MeshLambertMaterial({color:0xdcdad3}));
  gr.name='ground'; gr.rotation.x=-Math.PI/2; gr.position.set(FOCUS.x,-0.03,FOCUS.z); gr.receiveShadow=true; scene.add(gr);
})();

/* ===== 5. 日照 ===== */
const hemi=new THREE.HemisphereLight(0xe6edf5,0x6b6357,0.6); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff3e2,1.0); sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096); sun.shadow.bias=-0.0004;
const sc=sun.shadow.camera; sc.left=-SHADOW_R; sc.right=SHADOW_R; sc.top=SHADOW_R; sc.bottom=-SHADOW_R; sc.near=1; sc.far=700; sc.updateProjectionMatrix();
scene.add(sun); scene.add(sun.target); sun.target.position.copy(FOCUS);
function solar(date){
  const rad=Math.PI/180, d=date.valueOf()/864e5-0.5+2440588-2451545;
  const M=rad*(357.5291+0.98560028*d), C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const L=M+C+rad*102.9372+Math.PI, e=rad*23.4397;
  const dec=Math.asin(Math.sin(e)*Math.sin(L)), ra=Math.atan2(Math.sin(L)*Math.cos(e),Math.cos(L));
  const H=rad*(280.16+360.9856235*d)-rad*(-LON)-ra, phi=rad*LAT;
  const alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  let az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi))+Math.PI;
  return {alt:alt/rad, az:((az/rad)%360+360)%360};
}
let curDate=[3,21], curTime=10;
function applySun(){
  const dt=new Date(Date.UTC(2026,curDate[0]-1,curDate[1],Math.floor(curTime)-9,Math.round((curTime%1)*60)));
  const s=solar(dt), a=(s.az+NORTH_ANGLE)*Math.PI/180, al=Math.max(s.alt,-2)*Math.PI/180, D=300;
  sun.position.set(FOCUS.x+Math.cos(al)*Math.sin(a)*D, FOCUS.y+Math.sin(al)*D, FOCUS.z-Math.cos(al)*Math.cos(a)*D);
  const up=s.alt>0; sun.intensity=up?(0.5+0.8*Math.sin(al)):0; hemi.intensity=up?0.55:0.9;
  document.getElementById('sunOut').textContent=up?(s.alt.toFixed(1)+'° / '+s.az.toFixed(0)+'°'):'日の出前・日没後';
}

/* ===== 6. カメラ ===== */
const camera=new THREE.PerspectiveCamera(45,1,0.5,3000);
let target=new THREE.Vector3(), camTheta=0, camPhi=1.3, camDist=80;
function setCam(i){
  const c=CAMS[i];
  const eye=new THREE.Vector3(c[2][0]*S,c[2][2]*S,-c[2][1]*S);
  target.set(c[3][0]*S,c[3][2]*S,-c[3][1]*S);
  const d=eye.clone().sub(target);
  camDist=d.length(); camTheta=Math.atan2(d.x,d.z); camPhi=Math.acos(Math.max(-1,Math.min(1,d.y/camDist)));
  camera.fov=c[4]; camera.updateProjectionMatrix(); update();
  document.querySelectorAll('.cam').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
}
function update(){
  camPhi=Math.max(0.05,Math.min(Math.PI/2+0.75,camPhi)); camDist=Math.max(5,Math.min(900,camDist));
  camera.position.set(target.x+camDist*Math.sin(camPhi)*Math.sin(camTheta), target.y+camDist*Math.cos(camPhi), target.z+camDist*Math.sin(camPhi)*Math.cos(camTheta));
  camera.lookAt(target);
  document.getElementById('needle').setAttribute('transform','rotate('+(NORTH_ANGLE-camTheta*180/Math.PI)+' 20 20)');
}
/* 操作：マウス（左＝回転・右＝平行移動）とタッチ（1本指＝回転・2本指＝つまんで寄り引き＋ずらして平行移動） */
const cvs=renderer.domElement, pts=new Map(); let drag=null, pinch=null, moved=0;
function pan(dx,dy){ const s=camDist*0.0014;
  const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0), up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
  target.addScaledVector(right,-dx*s).addScaledVector(up,dy*s); }
function pinchState(){ const [a,b]=[...pts.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y), x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
cvs.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); try{cvs.setPointerCapture(e.pointerId);}catch(_){} moved=0;
  if(pts.size===2){ drag=null; pinch=pinchState(); }
  else if(pts.size===1){ drag={x:e.clientX,y:e.clientY,b:e.pointerType==='mouse'?e.button:0}; } });
cvs.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)){ if(e.pointerType==='mouse') hover(e); return; }
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size>=2){ const p=pinchState();
    if(p.d>0&&pinch.d>0) camDist*=pinch.d/p.d;
    pan(p.x-pinch.x,p.y-pinch.y); pinch=p; moved+=10; update(); return; }
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  if(drag.b===0){ camTheta-=dx*0.005; camPhi-=dy*0.005; } else pan(dx,dy);
  update();});
function release(e){ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
  if(e.type==='pointerup'&&e.pointerType!=='mouse'&&moved<6&&pts.size===0) hover(e);   // タップで周辺建物の高さを表示
  if(pts.size<2) pinch=null;
  if(pts.size===1){ const p=[...pts.values()][0]; drag={x:p.x,y:p.y,b:0}; } else if(pts.size===0) drag=null; }
cvs.addEventListener('pointerup',release); cvs.addEventListener('pointercancel',release);
cvs.addEventListener('contextmenu',e=>e.preventDefault());
cvs.addEventListener('wheel',e=>{e.preventDefault(); camDist*=Math.exp(e.deltaY*0.0011); update();},{passive:false});

/* 周辺建物にカーソルを当てると実測高さを表示 */
const ray=new THREE.Raycaster(), tip=document.getElementById('tip');
function hover(e){
  if(!groups.ctx.visible){tip.style.display='none';return;}
  const r=cvs.getBoundingClientRect(); const m=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(m,camera);
  const own=[]; Object.keys(groups).forEach(k=>{ if(k!=='ctx'&&k!=='road'&&groups[k].visible) groups[k].traverse(o=>{if(o.isMesh)own.push(o);}); });
  const hitOwn=ray.intersectObjects(own,false)[0];
  const hits=ray.intersectObjects(ctxPick.map(p=>p[0]),false);
  const h=hits[0];
  if(!h||(hitOwn&&hitOwn.distance<h.distance)){tip.style.display='none';return;}
  const idx=ctxPick.find(p=>p[0]===h.object)[1]; const f=h.faceIndex;
  const bd=idx.find(q=>f>=q[0]&&f<q[1]);
  if(!bd){tip.style.display='none';return;}
  tip.textContent=bd[2].i; tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px'; tip.style.display='block';
}

/* ===== 7. UI ===== */
document.getElementById('eyebrow').textContent=BRAND[0];
document.getElementById('h1').textContent=BRAND[1];
document.getElementById('sub').textContent=BRAND[2];
document.getElementById('finish').innerHTML=FINISH;
document.getElementById('estimate').innerHTML=ESTIMATE;
document.getElementById('ctxNote').innerHTML=CTX_NOTE;
document.getElementById('badge').innerHTML=BADGE;
document.getElementById('ctxCount').textContent=CONTEXT.bld.length+' 棟';
document.getElementById('latlon').textContent=LAT.toFixed(4)+'°N '+LON.toFixed(4)+'°E';
document.getElementById('camRange').textContent=CAMS[0][0]+' – '+CAMS[CAMS.length-1][0];
const tb=document.getElementById('tb');
TITLE.forEach(t=>{const d=document.createElement('div'); if(t[2]) d.className='wide'; d.innerHTML='<dt>'+t[0]+'</dt><dd>'+t[1]+'</dd>'; tb.appendChild(d);});
document.getElementById('tb2').innerHTML=tb.innerHTML+'<div class="wide"><dt>周辺の高さ</dt><dd>'+BADGE+'</dd></div>';
const camsEl=document.getElementById('cams');
CAMS.forEach((c,i)=>{const b=document.createElement('button'); b.className='cam'; b.type='button';
  b.setAttribute('aria-pressed',i===0); b.innerHTML='<b>'+c[0]+'</b><i>'+c[1]+'</i>'; b.addEventListener('click',()=>setCam(i)); camsEl.appendChild(b);});
const legEl=document.getElementById('legend'), layerCb={};
allLayers.forEach(l=>{const row=document.createElement('label'); row.className='lay';
  row.innerHTML='<span class="sw" style="background:'+l.sw+'"></span><span>'+l.label+'</span>';
  const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true; layerCb[l.id]=cb;
  cb.addEventListener('change',()=>{groups[l.id].visible=cb.checked; tip.style.display='none'; if(l.id==='ctx') syncCtx();});
  row.appendChild(cb); legEl.appendChild(row);});
/* 周辺の建物：画面左上の切り替え（凡例のスイッチと連動） */
const ctxOn=document.getElementById('ctxOn'), ctxOff=document.getElementById('ctxOff');
function syncCtx(){ const v=groups.ctx.visible; ctxOn.setAttribute('aria-pressed',v); ctxOff.setAttribute('aria-pressed',!v); }
function showCtx(v){ groups.ctx.visible=v; layerCb.ctx.checked=v; tip.style.display='none'; syncCtx(); }
ctxOn.addEventListener('click',()=>showCtx(true)); ctxOff.addEventListener('click',()=>showCtx(false));
if(!CONTEXT.bld.length){ ctxOn.disabled=ctxOff.disabled=true; ctxOff.setAttribute('aria-pressed','true'); ctxOn.setAttribute('aria-pressed','false');
  document.getElementById('ctxTogNote').textContent=(typeof CTX_EMPTY_NOTE!=='undefined'?CTX_EMPTY_NOTE:'未作成'); }
const op=document.getElementById('op'), opOut=document.getElementById('opOut');
function setOp(){const v=parseFloat(op.value); ctxMat.opacity=v; ctxUnk.opacity=v*0.8; ctxMat.depthWrite=ctxUnk.depthWrite=v>0.95; opOut.textContent=Math.round(v*100)+'%';}
op.addEventListener('input',setOp); setOp();
const datesEl=document.getElementById('dates');
[['春分',[3,21]],['夏至',[6,21]],['秋分',[9,23]],['冬至',[12,22]]].forEach((d,i)=>{
  const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=d[0]; b.setAttribute('aria-pressed',i===0);
  b.addEventListener('click',()=>{curDate=d[1]; applySun(); datesEl.querySelectorAll('.chip').forEach((x,j)=>x.setAttribute('aria-pressed',j===i));});
  datesEl.appendChild(b);});
const tm=document.getElementById('tm'), tmOut=document.getElementById('tmOut');
tm.addEventListener('input',()=>{curTime=parseFloat(tm.value); const h=Math.floor(curTime), m=Math.round((curTime-h)*60); tmOut.textContent=h+':'+String(m).padStart(2,'0'); applySun();});
function resize(){const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/Math.max(h,1); camera.updateProjectionMatrix();}
addEventListener('resize',resize);
scene.background=new THREE.Color(0xcfd5dc); scene.fog=new THREE.Fog(0xcfd5dc,450,1400);
resize(); setCam(0); applySun();

(function loop(){requestAnimationFrame(loop); renderer.render(scene,camera);})();
})();
</script>
